# API process only (Anexo J). No Postgres container. Engine: drp-infra-postgres.

name: ${COMPOSE_PROJECT_NAME:-drp-dev}

services:
  identity-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: drp-identity-api
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8081}
      SERVICE_NAME: ${SERVICE_NAME:-identity-service}
      IDENTITY_SEED_PASSWORD: ${IDENTITY_SEED_PASSWORD:-Spacehub1!}
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM:-}
      JWT_KID: ${JWT_KID:-spacehub-identity-2026}
      # Engine is drp-infra-postgres on this Compose network (no DB in this file).
      DATABASE_URL: ${DATABASE_URL:-postgres://identity_app:change-me-identity@postgres:5432/drp?sslmode=disable}
    ports:
      - "${HTTP_PORT:-8081}:8081"
    networks:
      - pg

networks:
  pg:
    name: ${IDENTITY_API_NETWORK:-drp-dev_default}
    external: true
