# API process only (Anexo J). No Postgres container. Engine: drp-infra-postgres.
# Same COMPOSE_PROJECT_NAME as infra (drp-dev | drp-qa | drp-main).
# Service name stays identity-api so NGINX DNS does not change.

name: ${COMPOSE_PROJECT_NAME:-drp-dev}

services:
  identity-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: drp-identity-api-${DRP_ENV:-dev}
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8081}
      SERVICE_NAME: ${SERVICE_NAME:-identity-service}
      IDENTITY_SEED_PASSWORD: ${IDENTITY_SEED_PASSWORD:?IDENTITY_SEED_PASSWORD is required}
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM:-}
      JWT_KID: ${JWT_KID:-spacehub-identity-2026}
      DATABASE_URL: ${DATABASE_URL:-postgres://identity_app:${IDENTITY_APP_PASSWORD:-change-me-identity}@postgres:5432/drp?sslmode=disable}
    ports:
      - "${HTTP_PORT:-8081}:8081"
    networks:
      - pg

networks:
  pg:
    name: ${IDENTITY_API_NETWORK:-${COMPOSE_PROJECT_NAME:-drp-dev}_default}
    external: true
